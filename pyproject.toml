[project]
name = "intake-triage"
version = "0.1.0"
description = "Two-layer intake triage prototype for AIVC Task 1.2"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
llm = ["anthropic>=1.0"]
dev = ["pytest>=8.0"]
ui = ["fastapi>=0.115", "uvicorn>=0.30"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["intake_triage*"]

[tool.setuptools.package-data]
intake_triage = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
